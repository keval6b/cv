name: Build CV

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    strategy:
      matrix:
        role: [platform, product]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build PDF
        run: ./compile.sh ${{ matrix.role }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: keval-kapdee-cv-${{ matrix.role }}
          path: out/keval-kapdee-cv-${{ matrix.role }}.pdf
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: keval-kapdee-cv-*
          merge-multiple: true
          path: out

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.pdf \
            --title "Latest CV" \
            --notes "Built from ${{ github.sha }}" \
            --latest
