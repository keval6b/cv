name: Build CV

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF
        run: make compile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keval-kapdee-cv
          path: out/keval-kapdee-cv.pdf
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: keval-kapdee-cv
          path: out

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/keval-kapdee-cv.pdf \
            --title "Latest CV" \
            --notes "Built from ${{ github.sha }}" \
            --latest
