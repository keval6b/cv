pipeline:
  build:
    image: ghcr.io/keval6b/xelatex:main
    commands:
      - make compile
      - echo ${REGISTRY_TOKEN}
      - curl --user "keval:${REGISTRY_TOKEN}" --upload-file "keval-kapdee-cv.pdf" "https://git.kapdee.uk/api/packages/keval/generic/latest/keval-kapdee-cv.pdf"
    secrets:
      - registry_token
    when:
      branch: main
