when:
  - event: push
    branch: main

steps:
  build:
    image: ghcr.io/keval6b/xelatex:main
    commands:
      - make compile
  push:
    image: curlimages/curl
    commands:
      - curl --user "keval:$PACKAGES_TOKEN" -X "DELETE" "https://git.kapdee.uk/api/packages/keval/generic/cv/${CI_COMMIT_BRANCH}/keval-kapdee-cv.pdf"
      - curl --user "keval:$PACKAGES_TOKEN" --upload-file "out/keval-kapdee-cv.pdf" "https://git.kapdee.uk/api/packages/keval/generic/cv/${CI_COMMIT_BRANCH}/keval-kapdee-cv.pdf"
    environment:
      PACKAGES_TOKEN:
        from_secret: packages_token
